name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Archive only committed source and publish checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir -p dist
          archive="security-risk-scanner-$version.zip"
          git archive --format=zip --prefix="security-risk-scanner-$version/" --output="dist/$archive" HEAD
          (cd dist && sha256sum "$archive" > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "dist/$archive" dist/SHA256SUMS --verify-tag --title "Security Risk Scanner $version" --notes-file "release-notes/$version.md"
